<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AES">
  <title>AES</title>
  <desc>A geometric fox head forming the letter A — the AES brand mark.</desc>
  <defs>
    <linearGradient id="aes-fav-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="aes-fav-fur" x1="18" y1="14" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD8FF"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#aes-fav-bg)"/>

  <!-- Ears: the two outer strokes also read as the legs of an "A". -->
  <path d="M16 15.5 24.5 25.5 19 34 13.5 24z" fill="url(#aes-fav-fur)"/>
  <path d="M48 15.5 39.5 25.5 45 34 50.5 24z" fill="url(#aes-fav-fur)"/>
  <path d="M17.4 19.6 22 25.2 19.4 29.1 16.4 23.6z" fill="#6D5CF0"/>
  <path d="M46.6 19.6 42 25.2 44.6 29.1 47.6 23.6z" fill="#6D5CF0"/>

  <!-- Muzzle: a broad triangle, mirroring the apex of the "A". -->
  <path d="M32 20.5 47 30.5c0 10.5-6.7 18.5-15 20.5-8.3-2-15-10-15-20.5z" fill="url(#aes-fav-fur)"/>

  <!-- Crossbar of the A, drawn as the fox's brow. -->
  <path d="M23.6 33.6h16.8" stroke="#6D5CF0" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes and nose. -->
  <circle cx="26.2" cy="38.6" r="2.5" fill="#2B2170"/>
  <circle cx="37.8" cy="38.6" r="2.5" fill="#2B2170"/>
  <path d="M32 44.2c1.9 0 3 1 3 2.1 0 1.5-1.4 2.6-3 2.6s-3-1.1-3-2.6c0-1.1 1.1-2.1 3-2.1z" fill="#2B2170"/>
</svg>
