#:schema node_modules/wrangler/config-schema.json
# ---------------------------------------------------------------------------
# AES — Cloudflare Worker configuration
# This file contains NON-SECRET configuration only.
# Secrets (B2 keys, SESSION_SECRET, ...) are set with `wrangler secret put`.
#
# The top-level configuration is the production deployment. This is deliberate:
# Cloudflare Workers Builds runs `npx wrangler deploy` without an --env flag.
# Local development uses the explicit `local` environment below so its simulated
# R2 binding is never validated or uploaded during a production deployment.
# ---------------------------------------------------------------------------
name = "anksocial"
main = "worker/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true
# Uncomment after the custom domain has been added to Cloudflare:
# routes = [{ pattern = "me.ankb.qzz.io", custom_domain = true }]

# Static assets (compiled CSS/JS, icons). Served by Cloudflare's asset layer
# before the Worker runs, so they never cost a Worker invocation.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true

# --- Production runtime configuration --------------------------------------
[vars]
ENVIRONMENT = "production"
SITE_NAME = "AES"
SITE_URL = "https://me.ankb.qzz.io"
SITE_DESCRIPTION = "AES — Ank Ecosystem Social"
STORAGE_PROVIDER = "b2"            # b2 | s3 | r2
MAX_UPLOAD_BYTES = "10485760"      # 10 MiB per file
MAX_JSON_BODY_BYTES = "262144"     # 256 KiB
ALLOWED_UPLOAD_MIME = "image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,audio/webm,audio/mp4,audio/ogg,audio/mpeg"
REGISTRATION_OPEN = "true"
LOG_LEVEL = "warn"

# --- D1: primary application database --------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ank-social"
database_id = "bca07a72-c075-46e9-9c2f-dee4aa18fffc" # replace after `npm run db:create`
migrations_dir = "migrations"

# --- KV: rate limiting, caches, short-lived tokens --------------------------
[[kv_namespaces]]
binding = "KV"
id = "186a5b4976754ed5bdb42af1cd98c423" # replace after `wrangler kv namespace create KV`

# Production intentionally has no R2 binding. Media uses Backblaze B2, so a
# Cloudflare account without an R2 subscription can deploy this Worker.

# --- Durable Objects: live chat rooms ---------------------------------------
# One object per conversation, used only to fan messages out over WebSockets.
# D1 stays the source of truth, so losing an object costs nothing but a
# reconnect. SQLite-backed classes are required: new namespaces can no longer
# be created on the KV backend, and the SQLite backend is the one available on
# the Workers Free plan.
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

# --- Scheduled maintenance --------------------------------------------------
[triggers]
crons = [
  "*/15 * * * *", # expired sessions + rate-limit sweep
  "27 3 * * *",   # nightly: orphan media cleanup, stats aggregation, hard-delete
]

# --- Queues (optional, paid feature) ----------------------------------------
# Background jobs run inline via ctx.waitUntil() when no queue is bound, so the
# app works without Queues. Enable for higher-volume fan-out:
#   wrangler queues create ank-social-jobs
#   wrangler queues create ank-social-jobs-dlq
# then uncomment:
# [[queues.producers]]
# binding = "JOBS"
# queue = "ank-social-jobs"
#
# [[queues.consumers]]
# queue = "ank-social-jobs"
# max_batch_size = 25
# max_batch_timeout = 10
# max_retries = 3
# dead_letter_queue = "ank-social-jobs-dlq"

# ===========================================================================
# Local development environment
# ===========================================================================
# `npm run dev` selects this environment explicitly. D1, KV and R2 are all
# simulated locally by Wrangler; no Cloudflare resource or R2 subscription is
# required. Binding IDs are intentionally omitted because they are unnecessary
# for local resources.
[env.local]
name = "anksocial-local"

[env.local.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[env.local.vars]
ENVIRONMENT = "development"
SITE_NAME = "AES"
SITE_URL = "http://localhost:8787"
SITE_DESCRIPTION = "AES — Ank Ecosystem Social"
STORAGE_PROVIDER = "r2"
MAX_UPLOAD_BYTES = "10485760"
MAX_JSON_BODY_BYTES = "262144"
ALLOWED_UPLOAD_MIME = "image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,audio/webm,audio/mp4,audio/ogg,audio/mpeg"
REGISTRATION_OPEN = "true"
LOG_LEVEL = "info"

[[env.local.d1_databases]]
binding = "DB"
database_name = "ank-social"
migrations_dir = "migrations"

[[env.local.kv_namespaces]]
binding = "KV"

[[env.local.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ank-social-media-local"

[[env.local.durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationRoom"

[[env.local.migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

[env.local.triggers]
crons = ["*/15 * * * *", "27 3 * * *"]

# ===========================================================================
# Preview environment
# ===========================================================================
[env.preview]
name = "anksocial-preview"

[env.preview.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[env.preview.vars]
ENVIRONMENT = "preview"
SITE_NAME = "AES (preview)"
SITE_URL = "https://anksocial-preview.workers.dev"
SITE_DESCRIPTION = "AES — Ank Ecosystem Social"
STORAGE_PROVIDER = "b2"
MAX_UPLOAD_BYTES = "10485760"
MAX_JSON_BODY_BYTES = "262144"
ALLOWED_UPLOAD_MIME = "image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,audio/webm,audio/mp4,audio/ogg,audio/mpeg"
REGISTRATION_OPEN = "true"
LOG_LEVEL = "info"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ank-social-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[[env.preview.durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationRoom"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom"]

[env.preview.observability]
enabled = true

[env.preview.triggers]
crons = ["*/15 * * * *", "27 3 * * *"]
